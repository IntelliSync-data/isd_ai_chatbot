name: Update ISD AI Chatbot BloomPod

on:
  push:
    branches:
      - bloompod

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy isd_ai_chatbot to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.BLOOMPOD_HOST }}
        username: ${{ secrets.BLOOMPOD_USERNAME }}
        key: ${{ secrets.BLOOMPOD_SSH_KEY }}
        script_stop: true
        script: |
          # Clone if not exists, otherwise update
          if [ ! -d ~/addons-system/isd_ai_chatbot ]; then
            git clone git@github.com:IntelliSync-data/isd_ai_chatbot.git ~/addons-system/isd_ai_chatbot
            cd ~/addons-system/isd_ai_chatbot && git checkout bloompod
          else
            cd ~/addons-system/isd_ai_chatbot
            git fetch origin && git reset --hard origin/bloompod
          fi

          # Only the chatbot itself: the OpenEduCat bridge is for sites that run OpenEduCat
          sudo mkdir -p ~/custom-addons/isd_ai_chatbot
          sudo rsync -av --delete \
            ~/addons-system/isd_ai_chatbot/isd_ai_chatbot/ ~/custom-addons/isd_ai_chatbot/

    - name: Update isd_ai_chatbot Module
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.BLOOMPOD_HOST }}
        username: ${{ secrets.BLOOMPOD_USERNAME }}
        key: ${{ secrets.BLOOMPOD_SSH_KEY }}
        script: |
          echo "Updating apps list..."
          echo "env['ir.module.module'].update_list(); env.cr.commit()" | sudo -u ubuntu /odoo-venv/bin/python /odoo18/odoo-bin shell -c /odoo.conf -d ${{ secrets.BLOOMPOD_DB_NAME }} --no-http
          if [ $? -ne 0 ]; then
            echo "update_list() FAILED"
            exit 1
          fi

          # A module that is not installed yet is skipped by -u: install it once from Apps
          echo "Updating isd_ai_chatbot module..."
          sudo -u ubuntu /odoo-venv/bin/python /odoo18/odoo-bin -c /odoo.conf -d ${{ secrets.BLOOMPOD_DB_NAME }} -u isd_ai_chatbot --stop-after-init --no-http
          if [ $? -ne 0 ]; then
            echo "Module update FAILED, last lines of the Odoo log:"
            sudo tail -n 60 /var/log/odoo/odoo.log
            exit 1
          fi

    - name: Restart Odoo Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.BLOOMPOD_HOST }}
        username: ${{ secrets.BLOOMPOD_USERNAME }}
        key: ${{ secrets.BLOOMPOD_SSH_KEY }}
        script: |
          sudo systemctl restart odoo

    - name: Verify Odoo Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.BLOOMPOD_HOST }}
        username: ${{ secrets.BLOOMPOD_USERNAME }}
        key: ${{ secrets.BLOOMPOD_SSH_KEY }}
        script: |
          sleep 5
          if sudo systemctl is-active --quiet odoo; then
            echo "Odoo restarted successfully"
          else
            echo "Odoo failed to restart"
            echo "=== systemctl status ==="
            sudo systemctl status odoo --no-pager
            echo "=== Last 50 lines of Odoo log ==="
            sudo tail -n 50 /var/log/odoo/odoo.log
            exit 1
          fi
